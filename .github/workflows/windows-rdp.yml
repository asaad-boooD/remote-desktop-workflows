name: WINDOWS RDP - CLOUDFLARE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled Successfully!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Configured!"

      - name: Start Cloudflare Tunnel
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          Write-Host ""
          
          # تشغيل النفق مع كتابة السجلات في ملف محدد
          Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url tcp://localhost:3389 --logfile cloudflared.log --loglevel debug" -NoNewWindow
          
          # الانتظار 30 ثانية لضمان كتابة الرابط في الملف
          Start-Sleep -Seconds 30
          
          # التحقق من وجود الملف وقراءته
          if (Test-Path "cloudflared.log") {
            $logContent = Get-Content -Path "cloudflared.log" -Raw
            $urlMatch = [regex]::Match($logContent, 'https://[a-zA-Z0-9-]+\.trycloudflare\.com')
            if ($urlMatch.Success) {
              Write-Host "✅ TUNNEL STARTED SUCCESSFULLY!"
              Write-Host "🌐 YOUR TUNNEL URL: $($urlMatch.Value)"
              Write-Host "💡 Copy this URL. You will need it to connect."
            } else {
              Write-Host "❌ Could not find the URL in the log file. Here is the full log:"
              Write-Host $logContent
            }
          } else {
            Write-Host "❌ Log file 'cloudflared.log' was not created. Here are the files in the current directory:"
            Get-ChildItem | Format-Table -AutoSize
          }
          
          Write-Host ""
          Write-Host "📋 CONNECTION DETAILS:"
          Write-Host "   USERNAME: runneradmin"
          Write-Host "   PASSWORD: P@ssw0rd123!"
          Write-Host "============================================"

      - name: Keep Session Alive
        run: |
          Write-Host "⏳ Session Active - Keeping alive..."
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
          }
